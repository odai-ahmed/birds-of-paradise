<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>كتالوج الجملة | طيور الجنة الراقية</title>
    <style>
        :root {
            --bg-grad: linear-gradient(135deg, #3d0201 0%, #830602 50%, #1a0000 100%);
            --card-bg: rgba(137, 53, 1, 0.65);
            --border-glow: rgba(229, 169, 59, 0.4);
            --gold-accent: #e5a93b;
            --gold-light: #fbe3b5;
            --text-white: #ffffff;
            --text-muted: #f3d4ca;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-grad);
            min-height: 100vh;
            color: var(--text-white);
            padding: 20px;
        }

        /* Header Styles */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-glow);
        }

        .header h1 {
            font-size: 20px;
            color: var(--gold-light);
        }

        .back-btn {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glow);
            color: var(--gold-accent);
            padding: 8px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .back-btn:active {
            background: var(--gold-accent);
            color: #3d0201;
        }

        /* Grid Layout */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Product Card Styles */
        .product-card {
            background: var(--card-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        .product-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
            background: #4a0301; /* Fallback color */
        }

        .product-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .product-sku {
            color: var(--gold-light);
            font-size: 12px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .product-details {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-align: right;
            line-height: 1.6;
            flex-grow: 1; /* Pushes button to bottom */
        }

        .order-btn {
            background: #25D366; /* WhatsApp Green */
            color: white;
            border: none;
            padding: 10px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .order-btn:active {
            transform: scale(0.95);
        }

        .order-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h1>تشكيلات الجملة المتوفرة</h1>
        <!-- Link back to your main page (index.html) -->
        <a href="index.html" class="back-btn">رجوع للرئيسية</a>
    </div>

    <!-- Products Grid -->
    <div class="catalog-grid" id="products-container">
        <!-- Products will be injected here by JavaScript -->
    </div>

    <script>
        // هنا يمكنك إضافة أو تعديل المنتجات بسهولة
        const products = [
            {
                id: "M-001",
                name: "طقم ولادي قطعتين",
                image: "https://via.placeholder.com/200/830602/FFFFFF?text=صورة+المنتج",
                colors: "أبيض، كحلي، بيج",
                sizes: "S - M - L - XL",
                pack: "الدرزن: 12 حبة"
            },
            {
                id: "D-055",
                name: "فستان بناتي راقي",
                image: "https://via.placeholder.com/200/830602/FFFFFF?text=صورة+المنتج",
                colors: "وردي، أحمر، ذهبي",
                sizes: "سنتين إلى 10 سنوات",
                pack: "الدرزن: 6 حبات"
            },
            {
                id: "T-102",
                name: "تيشيرت صيفي",
                image: "https://via.placeholder.com/200/830602/FFFFFF?text=صورة+المنتج",
                colors: "تشكيلة ألوان",
                sizes: "مقاسات موحدة",
                pack: "الدرزن: 24 حبة"
            }
        ];

        const container = document.getElementById('products-container');
        const phone = "966559558051"; // رقم الواتساب الخاص بك

        // دالة لعرض المنتجات
        function renderProducts() {
            products.forEach(product => {
                const textMsg = encodeURIComponent(`أهلاً، أرغب بالاستفسار عن طلب كمية من الموديل:\n*${product.name}*\n*رمز الموديل:* ${product.id}`);
                const whatsappLink = `https://wa.me/${phone}?text=${textMsg}`;

                const cardHTML = `
                    <div class="product-card">
                        <img src="${product.image}" alt="${product.name}" class="product-img">
                        <div class="product-title">${product.name}</div>
                        <div class="product-sku">الكود: ${product.id}</div>
                        <div class="product-details">
                            • الألوان: ${product.colors}<br>
                            • المقاسات: ${product.sizes}<br>
                            • التعبئة: ${product.pack}
                        </div>
                        <a href="${whatsappLink}" target="_blank" style="text-decoration: none;">
                            <button class="order-btn">
                                <svg viewBox="0 0 24 24"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m.01 1.67c2.2 0 4.26.86 5.82 2.42 1.56 1.56 2.41 3.63 2.41 5.83 0 4.54-3.7 8.24-8.24 8.24-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.32a8.19 8.19 0 0 1-1.26-4.38c.01-4.54 3.71-8.24 8.26-8.24"/></svg>
                                طلب الكمية
                            </button>
                        </a>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });
        }

        // تشغيل الدالة عند تحميل الصفحة
        renderProducts();
    </script>
</body>
</html>
